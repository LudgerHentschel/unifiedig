[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "unifiedig"
version = "0.1.1.dev1"
description = "A unified, model-agnostic interface for Integrated Gradients"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Ludger Hentschel"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "cbaseline>=0.1.2,<0.2",
    "numpy>=1.23",
    "scikit-learn>=1.2",
    "skgrad>=0.1.5,<0.2",
    "treeig>=0.2.0,<0.3",
]

[project.optional-dependencies]
docs = [
    "sphinx>=7,<9",
    "myst-parser>=3,<5",
    "pydata-sphinx-theme>=0.16,<0.17",
    "tomli>=2; python_version < '3.11'",
]

shap = ["shap>=0.42", "matplotlib>=3.6"]
torch = ["torch>=2.0"]
jax = ["jax>=0.4"]
tensorflow = ["tensorflow>=2.16"]
trees = ["treeig>=0.2.0,<0.3"]
catboost = ["catboost>=1.2", "treeig>=0.2.0,<0.3"]
all = [
    "matplotlib>=3.6",
    "catboost>=1.2",
    "jax>=0.4",
    "shap>=0.42",
    "tensorflow>=2.16",
    "torch>=2.0",
    "treeig>=0.2.0,<0.3",
]
test = [
    "build>=1",
    "matplotlib>=3.6",
    "pandas>=1.5",
    "pytest>=7",
    "shap>=0.42",
    "tomli>=2; python_version < '3.11'",
    "twine>=5",
]

[project.urls]
Documentation = "https://ludgerhentschel.github.io/unifiedig/"
Homepage = "https://github.com/LudgerHentschel/unifiedig"
Repository = "https://github.com/LudgerHentschel/unifiedig"
Issues = "https://github.com/LudgerHentschel/unifiedig/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
unifiedig = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
