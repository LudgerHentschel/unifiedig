[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "unifiedig"
version = "0.1.0.dev1"
description = "A unified, model-agnostic interface for Integrated Gradients"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Ludger Hentschel"}]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = ["numpy>=1.23", "scikit-learn>=1.2"]

[project.optional-dependencies]
shap = ["shap>=0.42"]
test = [
    "build>=1",
    "matplotlib>=3.6",
    "pandas>=1.5",
    "pytest>=7",
    "shap>=0.42",
    "tomli>=2; python_version < '3.11'",
    "twine>=5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
