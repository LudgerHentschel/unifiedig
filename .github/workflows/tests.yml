name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: pytest
      - run: python scripts/check_docs_examples.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m venv /tmp/wheel-check
      - run: /tmp/wheel-check/bin/python -m pip install dist/*.whl
      - run: /tmp/wheel-check/bin/python -m pip check
      - run: cd /tmp && /tmp/wheel-check/bin/python "$GITHUB_WORKSPACE/examples/quickstart.py"
      - run: python -m pip wheel --no-deps dist/*.tar.gz --wheel-dir /tmp/sdist-wheel

  torch:
    runs-on: ubuntu-latest
    env:
      KERAS_BACKEND: torch
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade ".[test,torch]" keras
      - run: pytest
      - run: python scripts/check_docs_examples.py

  jax:
    runs-on: ubuntu-latest
    env:
      KERAS_BACKEND: jax
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade ".[test,jax]" keras
      - run: pytest
      - run: python scripts/check_docs_examples.py

  tensorflow:
    runs-on: ubuntu-latest
    env:
      KERAS_BACKEND: tensorflow
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade ".[test,tensorflow]"
      - run: pytest
      - run: python scripts/check_docs_examples.py

  trees:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade ".[test,trees]" xgboost lightgbm
      - run: pytest
      - run: python scripts/check_docs_examples.py

  catboost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade ".[test,catboost]"
      - run: pytest
      - run: python scripts/check_docs_examples.py
