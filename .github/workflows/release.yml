name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python scripts/check_release_version.py
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - run: python -m pip install --upgrade ".[test,all]" xgboost lightgbm
      - run: pytest
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m venv /tmp/wheel-check
      - run: /tmp/wheel-check/bin/python -m pip install dist/*.whl
      - run: /tmp/wheel-check/bin/python -m pip check
      - run: cd /tmp && /tmp/wheel-check/bin/python "$GITHUB_WORKSPACE/examples/quickstart.py"
      - run: python -m pip wheel --no-deps dist/*.tar.gz --wheel-dir /tmp/sdist-wheel
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
