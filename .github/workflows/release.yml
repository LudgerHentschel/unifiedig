name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python scripts/check_release_version.py
      - run: python -m pip install --upgrade ".[test,torch]"
      - run: pytest
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: cd /tmp && python -c "import unifiedig; print(unifiedig.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
