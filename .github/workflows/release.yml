name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python scripts/check_release_version.py
      - run: python -m pip install --upgrade ".[test,all]" xgboost lightgbm
      - run: pytest
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m venv /tmp/wheel-check
      - run: /tmp/wheel-check/bin/python -m pip install dist/*.whl
      - run: /tmp/wheel-check/bin/python -m pip check
      - run: cd /tmp && /tmp/wheel-check/bin/python "$GITHUB_WORKSPACE/examples/quickstart.py"
      - run: python -m pip wheel --no-deps dist/*.tar.gz --wheel-dir /tmp/sdist-wheel
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/
      - name: Create release and attach distributions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            flags=(--verify-tag)
            if [[ "$GITHUB_REF_NAME" =~ (a|b|rc)[0-9]+$ ]]; then
              flags+=(--prerelease --latest=false)
            fi
            gh release create "$GITHUB_REF_NAME" \
              --generate-notes --title "$GITHUB_REF_NAME" "${flags[@]}"
          fi
          existing=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          for file in dist/*; do
            if ! grep -Fxq -- "$(basename "$file")" <<< "$existing"; then
              gh release upload "$GITHUB_REF_NAME" "$file"
            fi
          done
